[workspace]
members = ["crates/firmlens-core", "crates/firmlens-cli", "crates/firmlens-api"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["FirmLens contributors"]

[workspace.dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
tempfile = "3.15"
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
