name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Verify reproducible binary fixtures
        run: python scripts/generate_fixtures.py
      - run: git diff --exit-code -- fixtures
      - name: Generate portable archive fixtures
        run: python scripts/generate_archives.py
      - name: Compare real HTTP and CLI results
        run: python scripts/check_web_workflow.py
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo build --workspace --locked
      - run: python scripts/generate_archives.py
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
  binwalk-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build pinned Binwalk v3 image
        run: docker build -t firmlens-binwalk:3.1.0 containers/binwalk
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Exercise real isolated identification
        run: cargo test -p firmlens-core --locked --test ingestion live_binwalk -- --ignored
