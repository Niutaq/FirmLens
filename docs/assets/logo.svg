<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title">
  <title id="title">FirmLens — Home security logo</title>

  <defs>
    <!-- Ostrze: zewnętrzny łuk, podstawa, wewnętrzny łuk zbiegający się w ostrą końcówkę -->
    <path id="blade" d="
      M805 242
      C520 310 172 520 172 770
      C172 815 190 855 218 884
      L560 884
      C380 884 290 800 290 700
      C290 540 520 360 805 242 Z"/>

    <!-- Maska: ta sama figura z czarnym obrysem wycina równą przerwę w domu -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <use href="#blade" fill="#000000" stroke="#000000" stroke-width="44" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Dom -->
  <g id="house" mask="url(#gap)">
    <polygon points="512,140 218,405 218,884 512,884" fill="#2A2F38"/>
    <polygon points="512,140 805,405 805,884 512,884" fill="#121722"/>
  </g>

  <!-- Ostrze -->
  <use id="blade-shape" href="#blade" fill="#08CE88"/>
</svg>
